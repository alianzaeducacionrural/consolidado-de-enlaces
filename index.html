<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consolidado de enlaces · Alianza Educación Rural</title>
  <meta name="description" content="Directorio de todas las herramientas del equipo: formularios, paneles de administración y claves de acceso." />
  <meta name="theme-color" content="#0a0908" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0908'/%3E%3Cpath d='M16 4 27 16 16 28 5 16Z' fill='none' stroke='%23c9a24b' stroke-width='1.4'/%3E%3Cpath d='M16 10 22 16 16 22 10 16Z' fill='%23c9a24b'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="./assets/styles.css" />
  <script>
    try {
      var t = localStorage.getItem("cde.tema");
      document.documentElement.dataset.tema = (t === "light") ? "light" : "dark";
    } catch (e) { document.documentElement.dataset.tema = "dark"; }
  </script>
</head>
<body>
  <div class="vignette" aria-hidden="true"></div>

  <div id="gate" class="gate">
    <div class="gate-caja">
      <span class="gate-emblema" aria-hidden="true">
        <svg viewBox="0 0 32 32">
          <path d="M16 3.5 28.5 16 16 28.5 3.5 16Z" fill="none" stroke="currentColor" stroke-width="1.1"/>
          <path d="M16 9.5 22.5 16 16 22.5 9.5 16Z" fill="currentColor"/>
        </svg>
      </span>
      <h1>Consolidado de enlaces</h1>
      <p class="gate-sub">Acceso privado del equipo. Escribe la clave para entrar.</p>
      <form id="gateForm" class="gate-form" autocomplete="off">
        <label class="gate-campo">
          <span class="ic" data-ic="lock" aria-hidden="true"></span>
          <input id="gateClave" type="password" placeholder="Clave de acceso" autocomplete="current-password" spellcheck="false" required />
        </label>
        <button type="submit" class="btn btn-leaf">Entrar</button>
        <p id="gateError" class="gate-error" hidden>Clave incorrecta. Intenta de nuevo.</p>
      </form>
    </div>
  </div>

  <div class="shell">
    <aside class="rail" id="rail" aria-label="Categorías">
      <a class="rail-marca" href="./">
        <span class="rail-emblema" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <path d="M16 3.5 28.5 16 16 28.5 3.5 16Z" fill="none" stroke="currentColor" stroke-width="1.1"/>
            <path d="M16 9.5 22.5 16 16 22.5 9.5 16Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="rail-marca-txt">Consolidado<br>de enlaces</span>
      </a>

      <nav id="chips" class="rail-nav"></nav>

      <div class="rail-foot">
        <button id="btnAgregar" class="rail-btn rail-btn-cta" type="button">
          <span class="ic" data-ic="plus"></span><span>Agregar herramienta</span>
        </button>
        <button id="btnClaves" class="rail-btn" type="button">
          <span class="ic" data-ic="key"></span><span>Claves guardadas</span>
        </button>
        <button id="btnTema" class="rail-btn" type="button">
          <span class="ic" data-ic="moon"></span><span id="temaLbl">Modo claro</span>
        </button>
      </div>
    </aside>

    <div class="rail-scrim" id="railScrim" hidden></div>

    <main class="contenido">
      <header class="topbar">
        <button class="rail-toggle" id="railToggle" type="button" aria-label="Categorías">
          <span class="ic" data-ic="menu"></span>
        </button>
        <div class="buscador">
          <span class="ic" data-ic="search" aria-hidden="true"></span>
          <input id="q" type="search" placeholder="Buscar herramienta, etiqueta o enlace…" autocomplete="off" spellcheck="false" />
        </div>
      </header>

      <div class="encabezado">
        <h1 id="tituloCat">Directorio</h1>
        <span id="pieInfo" class="conteo"></span>
      </div>

      <div id="lista" class="lista"></div>
      <p id="vacio" class="estado-vacio" hidden>Ninguna herramienta coincide con la búsqueda.</p>

      <footer class="pie">
        Herramientas y claves se guardan en la <strong>hoja de Google del backend</strong> — no en este navegador.
      </footer>
    </main>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-fondo" data-cerrar></div>
    <div class="modal-caja" role="dialog" aria-modal="true">
      <button class="modal-x" data-cerrar type="button" aria-label="Cerrar"><span class="ic" data-ic="x"></span></button>
      <div id="modalContenido"></div>
    </div>
  </div>

  <script src="./assets/config.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
